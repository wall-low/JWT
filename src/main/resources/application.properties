spring.application.name=JWT

# База данных H2 в памяти
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Консоль H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8081

logging.level.com.web_site.JWT=INFO

# Секрет берётся из переменной окружения JWT_SECRET.
# Значение после двоеточия — запасное, только для локального запуска.
jwt.secret=${JWT_SECRET:local-dev-secret-key-minimum-256-bits-long-do-not-use-in-production}

# Время жизни токенов в миллисекундах.
# access — 15 минут, refresh — 7 дней.
# Чтобы увидеть автоматическое обновление токена вживую, поставь access в 5000 (5 секунд).
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Как часто чистить чёрный список от протухших токенов — раз в час
jwt.blacklist-cleanup-interval=3600000
