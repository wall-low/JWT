<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">JWT Demo</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/protected">Главная</a>
                <a class="nav-link" href="/profile">Профиль</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="alert alert-success" id="tokenRefreshAlert" style="display:none;">
            ✅ Access token обновлён автоматически!
        </div>

        <h1>Защищенная страница</h1>
        <div class="card mb-3">
            <div class="card-body">
                <h5>Информация о пользователе:</h5>
                <p>Username: <span id="username"></span></p>
                <p>Access Token: <code id="accessToken" style="word-break: break-all;"></code></p>
                <p>Refresh Token: <code id="refreshToken" style="word-break: break-all;"></code></p>

            </div>
        </div>

        <button id="logoutBtn" class="btn btn-danger mt-3">Выйти</button>
    </div>

<script>
  // Декодирование JWT токена
  function parseJwt(token) {
      try {
          const base64Url = token.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
          return JSON.parse(jsonPayload);
      } catch (e) {
          console.error('Ошибка декодирования JWT:', e);
          return { exp: 0 };
      }
  }

  // Проверяет и обновляет токен если он истёк
  async function checkAndRefreshToken() {
      const accessToken = localStorage.getItem('accessToken');
      const refreshToken = localStorage.getItem('refreshToken');

      if (!accessToken || !refreshToken) {
          return false;
      }

      const tokenData = parseJwt(accessToken);
      const currentTime = Math.floor(Date.now() / 1000);

      // Если токен истёк или истечёт в течение 10 секунд
      if (tokenData.exp <= currentTime + 10) {
          console.log('🔄 Access token истёк или скоро истечёт. Обновляем...');

          try {
              const response = await fetch('/api/auth/refresh', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                      refreshToken: refreshToken
                  })
              });

              if (response.ok) {
                  const data = await response.json();
                  const oldToken = localStorage.getItem('accessToken');
                  localStorage.setItem('accessToken', data.accessToken);

                  console.log('✅ Access token обновлён!');
                  console.log('🔑 Старый:', oldToken.slice(-20));
                  console.log('🔑 Новый:', data.accessToken.slice(-20));

                  return true; // Токен был обновлён
              } else {
                  console.error('❌ Ошибка обновления токена');
                  localStorage.clear();
                  window.location.href = '/login';
              }
          } catch (error) {
              console.error('❌ Ошибка:', error);
          }
      } else {
          const timeLeft = tokenData.exp - currentTime;
          console.log(`✅ Access token ещё валиден (осталось ${timeLeft} сек)`);
      }

      return false;
  }

  window.onload = async function() {
      const accessToken = localStorage.getItem('accessToken');
      const refreshToken = localStorage.getItem('refreshToken');
      const username = localStorage.getItem('username');

      // Если нет токенов - редирект на логин
      if (!accessToken) {
          window.location.href = '/login';
          return;
      }

      const wasRefreshed = await checkAndRefreshToken();
      if (wasRefreshed) {
          // Показываем уведомление
          const alert = document.getElementById('tokenRefreshAlert');
          alert.style.display = 'block';
          setTimeout(() => {
              alert.style.display = 'none';
          }, 3000);
      }

      // Показываем данные (после возможного обновления)
      const currentAccessToken = localStorage.getItem('accessToken');
      const currentRefreshToken = localStorage.getItem('refreshToken');

      document.getElementById('username').textContent = username;
      document.getElementById('accessToken').textContent = currentAccessToken;
      document.getElementById('refreshToken').textContent = currentRefreshToken;
  }

  // Кнопка выхода
  document.getElementById('logoutBtn').addEventListener('click', async function() {
      const token = localStorage.getItem('accessToken');

      await fetch('/api/auth/logout', {
          method: 'POST',
          headers: {
              'Authorization': 'Bearer ' + token
          }
      });

      localStorage.clear();
      window.location.href = '/login';
  });

  // Кнопка тестирования API
  document.getElementById('testApiBtn').addEventListener('click', async function() {
      const token = localStorage.getItem('accessToken');

      try {
          const response = await fetch('/api/user/info', {
              headers: {
                  'Authorization': 'Bearer ' + token
              }
          });

          if (response.ok) {
              const data = await response.json();
              alert('✅ API доступен!\n\n' +
                    'Username: ' + data.username + '\n' +
                    'Message: ' + data.message + '\n' +
                    'Time: ' + data.timestamp);
          } else {
              alert('❌ Доступ запрещен! Код: ' + response.status);
          }
      } catch (error) {
          alert('Ошибка: ' + error.message);
      }
  });
</script>
</body>
</html>
