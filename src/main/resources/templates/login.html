<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">
            <form id="loginForm" class="p-4 bg-white rounded shadow">
                <h1 class="h3 mb-4 text-center">Вход в систему</h1>

                <!-- Сообщение об ошибке -->
                <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

                <div class="form-floating mb-3">
                    <input type="text"
                           class="form-control"
                           id="username"
                           name="username"
                           placeholder="Логин"
                           required>
                    <label for="username">Логин</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password"
                           placeholder="Пароль"
                           required>
                    <label for="password">Пароль</label>
                </div>

                <button class="btn btn-primary w-100 py-2" type="submit">Войти</button>

                <p class="mt-2 mb-0 text-muted text-center small">© 2025</p>
            </form>
        </div>
    </div>
</div>

<script>
    // Обработчик отправки формы
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Останавливаем обычную отправку формы

        // Получаем данные из формы
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Скрываем предыдущие ошибки
        document.getElementById('errorMessage').classList.add('d-none');

        try {
            // Отправляем POST запрос на /api/auth/login
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            // Проверяем статус ответа
            if (response.ok) {
                // Успешная авторизация - получаем токены
                const data = await response.json();

                // Сохраняем токены в localStorage
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('username', data.username);

                console.log('✅ Авторизация успешна!');
                console.log('Access Token:', data.accessToken);
                console.log('Refresh Token:', data.refreshToken);

                // Перенаправляем на защищенную страницу
                window.location.href = '/protected';

            } else {
                // Ошибка авторизации
                const errorText = await response.text();
                showError(errorText);
            }

        } catch (error) {
            showError('Ошибка соединения с сервером: ' + error.message);
        }
    });

    // Функция отображения ошибки
    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.classList.remove('d-none');
    }

    // Обработчик ссылки "Зарегистрироваться"
    document.getElementById('registerLink').addEventListener('click', async function(e) {
        e.preventDefault();

        const username = prompt('Введите логин:');
        const password = prompt('Введите пароль:');

        if (username && password) {
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const result = await response.text();

                if (response.ok) {
                    alert(result + '\n\nТеперь можете войти!');
                } else {
                    alert(result);
                }

            } catch (error) {
                alert('Ошибка регистрации: ' + error.message);
            }
        }
    });
</script>

</body>
</html>
