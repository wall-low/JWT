<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Вход</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="wrap-narrow">

    <div style="text-align:center; margin-bottom:28px">
        <h1 style="margin:0 0 4px; font-size:22px">JWT Authentication</h1>
        <p class="muted" style="margin:0; font-size:13.5px">Демонстрация access и refresh токенов</p>
    </div>

    <div class="card">

        <div class="tabs">
            <button id="tabLogin" class="active" type="button">Вход</button>
            <button id="tabRegister" type="button">Регистрация</button>
        </div>

        <div id="alert" class="alert hidden"></div>

        <form id="loginForm">
            <div class="field">
                <label for="loginUsername">Логин</label>
                <input type="text" id="loginUsername" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="loginPassword">Пароль</label>
                <input type="password" id="loginPassword" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-wide">Войти</button>
            <p class="hint">Тестовый пользователь: <code>admin</code> / <code>admin</code></p>
        </form>

        <form id="registerForm" class="hidden">
            <div class="field">
                <label for="regUsername">Логин</label>
                <input type="text" id="regUsername" autocomplete="username" required>
                <span class="err" id="errUsername"></span>
            </div>
            <div class="field">
                <label for="regPassword">Пароль</label>
                <input type="password" id="regPassword" autocomplete="new-password" required>
                <span class="err" id="errPassword"></span>
            </div>
            <button type="submit" class="btn btn-wide">Зарегистрироваться</button>
            <p class="hint">Логин от 3 символов, пароль от 6.</p>
        </form>

    </div>
</div>

<script>
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alert');

    function switchTab(toRegister) {
        tabRegister.classList.toggle('active', toRegister);
        tabLogin.classList.toggle('active', !toRegister);
        registerForm.classList.toggle('hidden', !toRegister);
        loginForm.classList.toggle('hidden', toRegister);
        hideAlert();
        clearFieldErrors();
    }

    tabLogin.addEventListener('click', () => switchTab(false));
    tabRegister.addEventListener('click', () => switchTab(true));

    function showAlert(text, ok) {
        alertBox.className = 'alert ' + (ok ? 'alert-ok' : 'alert-err');
        alertBox.textContent = text;
    }

    function hideAlert() {
        alertBox.className = 'alert hidden';
        alertBox.textContent = '';
    }

    function clearFieldErrors() {
        document.getElementById('errUsername').textContent = '';
        document.getElementById('errPassword').textContent = '';
    }

    async function readError(response) {
        try {
            return await response.json();
        } catch (e) {
            return { message: 'Сервер вернул неожиданный ответ' };
        }
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('loginUsername').value,
                password: document.getElementById('loginPassword').value
            })
        });

        if (!response.ok) {
            const error = await readError(response);
            showAlert(error.message || 'Не удалось войти', false);
            return;
        }

        const data = await response.json();
        localStorage.setItem('accessToken', data.accessToken);
        localStorage.setItem('refreshToken', data.refreshToken);
        localStorage.setItem('username', data.username);
        localStorage.setItem('refreshCount', '0');

        window.location.href = '/protected';
    });

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();
        clearFieldErrors();

        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('regUsername').value,
                password: document.getElementById('regPassword').value
            })
        });

        const body = await readError(response);

        if (!response.ok) {
            if (body.fields) {
                if (body.fields.username) {
                    document.getElementById('errUsername').textContent = body.fields.username;
                }
                if (body.fields.password) {
                    document.getElementById('errPassword').textContent = body.fields.password;
                }
            }
            showAlert(body.message || 'Не удалось зарегистрироваться', false);
            return;
        }

        registerForm.reset();
        switchTab(false);
        showAlert('Аккаунт создан. Теперь войдите.', true);
    });
</script>

</body>
</html>
